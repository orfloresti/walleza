# Alembic configuration for the `backend/` uv project.
#
# There is intentionally NO `sqlalchemy.url` here: `migrations/env.py`
# resolves the connection string at runtime from `app.config.get_settings()`
# (`resolved_migrations_database_url`), so the same file works locally, in
# CI, and in tests without editing this ini or exporting a shell variable
# by hand (design D2/D3 — migrations use the direct `:5432` connection,
# never the pooled `:6543` one used by `app/db.py` at runtime).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
